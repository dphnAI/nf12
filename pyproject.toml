[build-system]
# The MLX extension (macOS) is built when the build environment has mlx and
# nanobind (NF12_BUILD_MLX=AUTO); otherwise nf12.mlx builds it on first use.
# They are not build requirements, so torch-only and offline builds never need them.
requires = ["scikit-build-core>=0.10", "torch>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "nf12"
version = "1.1.0"
description = "Lossless 12-bit encoding of BF16 weights with fused CUDA, HIP and Metal decode-GEMM kernels"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.10"]

[project.optional-dependencies]
# nanobind is needed to rebuild the extension for an MLX other than the one
# the wheel was built with; it must be the nanobind version that MLX uses.
mlx = [
  "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "nanobind>=3.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
test = ["pytest", "numpy", "safetensors"]
bench = ["huggingface-hub", "numpy", "safetensors"]

# uv builds (development) include the MLX extension. MLX has no stable C++ ABI
# and its Python bindings share nanobind state only with the same nanobind ABI,
# so the pair is pinned; nf12.mlx rebuilds for another installed MLX at first use.
[tool.uv.extra-build-dependencies]
nf12 = [
  "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "nanobind==3.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
# Rebuild native libraries when sources or the target architectures change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "cmake/**/*" },
  { file = "csrc/**/*" },
  { file = "include/**/*" },
  { env = "NF12_CUDA_ARCHS" },
  { env = "NF12_BUILD_NATIVE" },
  { env = "NF12_BUILD_MLX" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
ninja.make-fallback = false
# Reuse the build tree for incremental editable installs.
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/nf12"]
# The torch stable ABI does not depend on the Python ABI.
wheel.py-api = "py3"
sdist.exclude = [".venv", "build"]

[tool.scikit-build.cmake.define]
NF12_CUDA_ARCHS = { env = "NF12_CUDA_ARCHS", default = "80;86;89;90;100;103;110;120" }
NF12_BUILD_NATIVE = { env = "NF12_BUILD_NATIVE", default = "ON" }
NF12_BUILD_MLX = { env = "NF12_BUILD_MLX", default = "AUTO" }

# macOS wheels carry the CPython MLX extension (nf12._mlx_ext).
[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
wheel.py-api = ""

[tool.pytest.ini_options]
testpaths = ["tests/api", "tests/mlx"]
# tests/portable_random.py: seeded data that is identical on every machine and device.
pythonpath = ["tests"]
